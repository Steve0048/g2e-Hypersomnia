# Le client web d'Hypersomnia pour Game2Earn : le code officiel (TeamHypersomnia/Hypersomnia, AGPL-3.0) à une version
# figée, avec les changements de Game2Earn (dossier game2earn/ de cette branche), compilé en WebAssembly avec
# Emscripten, comme scripts/build_web.sh des créateurs. Le résultat (4 fichiers) est un artefact de l'exécution.
name: Client web Game2Earn

on:
  push:
    branches: [game2earn]
  workflow_dispatch:

env:
  # La version officielle de départ (master du 1er novembre 2026, après la 4.4.0).
  UPSTREAM_SHA: 0049839a26eb571afce084f17367cd63b5f90171

# La version compilée est publiée en « release » (client-web.tar.gz), téléchargée par Game2Earn à la publication du jeu.
permissions:
  contents: write

concurrency:
  group: web-game2earn
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Code officiel d'Hypersomnia
        uses: actions/checkout@v4
        with:
          repository: TeamHypersomnia/Hypersomnia
          ref: ${{ env.UPSTREAM_SHA }}
          submodules: recursive
          path: hypersomnia

      - name: Changements Game2Earn
        uses: actions/checkout@v4
        with:
          path: g2e

      - name: Appliquer les changements Game2Earn
        run: |
          if [ -d g2e/game2earn/fichiers ]; then cp -rv g2e/game2earn/fichiers/. hypersomnia/; fi
          if ls g2e/game2earn/patches/*.patch >/dev/null 2>&1; then
            for p in g2e/game2earn/patches/*.patch; do git -C hypersomnia apply --verbose "$GITHUB_WORKSPACE/$p"; done
          fi
          # ImGui est un sous-module : ses correctifs s'appliquent dans son dossier.
          if ls g2e/game2earn/patches/imgui/*.patch >/dev/null 2>&1; then
            for p in g2e/game2earn/patches/imgui/*.patch; do git -C hypersomnia/src/3rdparty/imgui apply --verbose "$GITHUB_WORKSPACE/$p"; done
          fi

      - name: Outils
        # Sans les paquets Ubuntu (leurs miroirs Azure tombent parfois en panne) : cmake, gcc et Python sont déjà sur
        # la machine ; ninja vient de PyPI.
        run: |
          if ! command -v ninja; then
            pipx install ninja || {
              mkdir -p "$HOME/.local/bin"
              curl -fsSL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
              unzip -o /tmp/ninja.zip -d "$HOME/.local/bin"
            }
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          cmake --version | head -1; g++ --version | head -1

      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Outils natifs du build (version, introspection)
        run: |
          B=$GITHUB_WORKSPACE/build
          mkdir -p $B/prebuilt-version $B/prebuilt-introspector
          cd $B/prebuilt-version
          CC=gcc CXX=g++ cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release $GITHUB_WORKSPACE/hypersomnia/cmake/version_file_generator -G Ninja
          ninja
          cd $B/prebuilt-introspector
          CC=gcc CXX=g++ cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release $GITHUB_WORKSPACE/hypersomnia/cmake/Introspector-generator -G Ninja
          ninja

      - name: Compilation web
        run: |
          B=$GITHUB_WORKSPACE/build
          cd $B
          # Avertissement devenu erreur avec le clang récent d'Emscripten (champ inutilisé dans settings_gui.h).
          export CXXFLAGS="-Wno-error=unused-private-field"
          CC=clang CXX=clang++ emcmake cmake -DARCHITECTURE=Web -DCMAKE_BUILD_TYPE=Release \
            -DVERSION_FILE_GENERATOR_PATH=$B/prebuilt-version/version_file_generator \
            -DINTROSPECTOR_GENERATOR_PATH=$B/prebuilt-introspector/Introspector-generator \
            -D_CMAKE_TOOLCHAIN_PREFIX=llvm- -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DUSE_O3=1 -DGENERATE_DEBUG_INFORMATION=0 -DUSE_BIGINT=OFF $GITHUB_WORKSPACE/hypersomnia -G Ninja
          # -k 0 : on continue après une erreur, pour voir toutes les erreurs d'un coup.
          ninja -j4 -k 0 > ninja.log 2>&1 || true
          echo "===== Erreurs (uniques) ====="
          grep -E "error:" ninja.log | sed -E 's#^.*/hypersomnia/##' | sort -u | head -n 80 || true
          echo "===== Fin du journal ====="
          tail -n 40 ninja.log
          test -f Hypersomnia.wasm
          ls -la Hypersomnia.*

      - name: Fichiers du client
        run: |
          mkdir -p client
          cp build/Hypersomnia.html build/Hypersomnia.js build/Hypersomnia.wasm build/Hypersomnia.data client/
          if [ -d hypersomnia/cmake/web/assets ]; then cp -r hypersomnia/cmake/web/assets client/assets; fi
          du -sh client/* | sort -h

      - name: Cache du jeu préparé (Chrome sans écran)
        # Sans lui, le jeu marche aussi : il calcule ce cache au premier lancement, plus lentement.
        continue-on-error: true
        timeout-minutes: 50
        run: |
          cd g2e/game2earn
          npm install --no-audit --no-fund puppeteer-core@23.11.1
          node precache.mjs "$GITHUB_WORKSPACE/client"
          ls -la "$GITHUB_WORKSPACE/client"

      - uses: actions/upload-artifact@v4
        with:
          name: client-web-game2earn
          path: client/
          retention-days: 30

      - name: Publier la version (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="client-${{ github.run_number }}-${GITHUB_SHA::7}"
          tar -czf client-web.tar.gz -C client .
          sha256sum client-web.tar.gz | tee client-web.tar.gz.sha256
          gh release create "$VERSION" client-web.tar.gz client-web.tar.gz.sha256             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "Client web Game2Earn $VERSION"             --notes "Hypersomnia (TeamHypersomnia, AGPL-3.0) au commit officiel $UPSTREAM_SHA, avec les changements de la branche game2earn ($GITHUB_SHA)."
          echo "Version publiée : $VERSION"
